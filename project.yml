name: FreetifyMusique

options:
  bundleIdPrefix: com.abdoutp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FreetifyMusique:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Freetify Musique
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSAppleMusicUsageDescription: Freetify Musique accède à Apple Music pour chercher et lire le catalogue (avec votre abonnement) et pour lire vos playlists afin de les recréer dans l'app.
        NSHumanReadableCopyright: Dev by AbdouTP
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: Background
          UIImageName: Logo
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdoutp.freetifymusique
        PRODUCT_NAME: FreetifyMusique
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO

  FreetifyMusiqueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FreetifyMusique
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdoutp.freetifymusique.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO

schemes:
  FreetifyMusique:
    build:
      targets:
        FreetifyMusique: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FreetifyMusiqueTests
    profile:
      config: Release
    archive:
      config: Release
